<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2433">
<title>Varnethryl 3D Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b2433;font-family:system-ui,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:12px;text-shadow:0 1px 3px #000}
#hud b{font-size:14px;letter-spacing:.08em}
#hud a{pointer-events:auto;color:#fff;background:#0007;padding:6px 10px;border-radius:14px;text-decoration:none;border:1px solid #fff4}
#fps{opacity:.8}
#hint{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12px;opacity:.75;text-shadow:0 1px 3px #000;pointer-events:none;text-align:center;transition:opacity 1s}
#stick{position:fixed;left:max(22px,env(safe-area-inset-left));bottom:max(46px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff55;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#ffffffaa;border:2px solid #fff;box-shadow:0 2px 6px #0006}
#heroes{position:fixed;right:10px;bottom:max(60px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#heroes button{background:#0008;color:#fff;border:1px solid #fff5;border-radius:14px;padding:8px 12px;font-size:12px;touch-action:manipulation}
#heroes button.on{background:#c9a24acc;color:#1b2433;font-weight:700}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1b2433;font-size:14px;transition:opacity .4s}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div><b>VARNETHRYL 3D</b><br><span>Liongate prototype</span><br><span id="fps">-- fps</span></div><a href="index.html">&larr; Game</a></div>
<div id="stick"><div id="knob"></div></div>
<div id="heroes"></div>
<div id="hint">Joystick or tap the ground to move &middot; drag to rotate camera</div>
<div id="load">Loading Liongate...</div>
<script type="module" src="proto3d/main.js"></script>
</body></html>
