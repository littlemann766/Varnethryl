name: Verify Varnethryl offline cache
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'www/sw.js'
      - 'www/proto3d.html'
      - 'www/proto3d/main.js'
      - 'tools/check_release_cache.mjs'
      - '.github/workflows/verify-cache.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline cache and release version
        run: node tools/check_release_cache.mjs
      - name: Verify game assets
        run: python3 tools/check_assets.py
