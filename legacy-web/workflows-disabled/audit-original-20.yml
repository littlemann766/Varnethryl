name: Audit original 20 hero models
on:
  pull_request:
    branches: [main]
    paths:
      - 'www/proto3d/main.js'
      - 'www/proto3d/models/**'
      - 'tools/audit_original_20.py'
      - '.github/workflows/audit-original-20.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hero model rigs without changing original files
        run: python3 tools/audit_original_20.py
      - name: Publish original 20 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Varnethryl-Original-20-Character-Audit
          path: |
            model-original-20-audit.json
            model-original-20-audit.md
          if-no-files-found: warn
      - name: Append audit summary
        if: success()
        run: cat model-original-20-audit.md >> "$GITHUB_STEP_SUMMARY"
