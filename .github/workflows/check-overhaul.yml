name: Validate staged Varnethryl overhaul
on:
  pull_request:
    branches: [main]
    paths:
      - 'www/proto3d/**'
      - 'tools/check_overhaul.mjs'
      - 'tools/verify_frost_troll_b.py'
      - '.github/workflows/check-overhaul.yml'
permissions:
  contents: read
jobs:
  overhaul-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check overhaul invariants and syntax
        run: node tools/check_overhaul.mjs
      - name: Verify Frost Troll B is the animated bipedal mesh, never a serpent
        run: python3 tools/verify_frost_troll_b.py
      - name: Check persistent EXP, level rollover, and ornate UI frames
        run: node tools/check_exp_ui.mjs
      - name: Check boss arena retreat, telegraph warnings, and respawning
        run: node tools/check_boss_ai.mjs
      - name: Verify authored serpent gait selection without changing other heroes
        run: node tools/check_serpent_locomotion.mjs
      - name: Verify dark Frost Cave, lava atmosphere, and restoration
        run: node tools/check_zone_ambience.mjs
      - name: Verify Balthrix pitch follows terrain safely
        run: node tools/check_terrain_follow.mjs
      - name: Verify ice particles, cave formation physics, and lit boss arenas
        run: node tools/check_frost_visuals.mjs
      - name: Verify Titan lava pools, rising embers, and safe-city culling
        run: node tools/check_volcano_visuals.mjs
      - name: Verify voluntary lock-on boss framing without breaking free camera
        run: node tools/check_boss_camera.mjs
      - name: Verify live 3D sailing ships and harbor water motion
        run: node tools/check_harbor_ships.mjs
      - name: Check established encounter geography and gameplay invariants
        run: node tools/check_boss_regions.mjs
      - name: Check walkable terrain and portal stability
        run: node tools/check_town_mountains.mjs
