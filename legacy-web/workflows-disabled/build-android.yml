name: Build Varnethryl Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
concurrency:
  group: varnethryl-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check game assets
        run: |
          python3 tools/check_assets.py
          python3 tools/verify_frost_troll_b.py
          python3 tools/audit_wren_wings.py
      - name: Check overhaul, boss attacks, movement, owner maps and offline release
        run: |
          node tools/check_overhaul.mjs
          node tools/check_multiplayer_ocean_arena.mjs
          node tools/check_ladders_jump.mjs
          node tools/check_multitouch_controls.mjs
          node tools/check_owner_map_routes.mjs
          node tools/check_serpent_locomotion.mjs
          node tools/boss_patterns_test.mjs
          node tools/owner_cheats_test.mjs
          node tools/owner_async_cheats_test.mjs
          node tools/owner_3d_progression_test.mjs
          node tools/check_release_cache.mjs
      - name: Check JavaScript syntax
        run: |
          find www -type f -name "*.js" -not -path "*/vendor/*" -print0 | xargs -0 -n1 node --check
      - name: Add Android project
        run: npx cap add android
      - name: Bundle approved raw marine GLBs for Android WebViews
        run: python3 tools/prepare_marine_assets.py
      - name: Copy web assets
        run: npx cap sync android
      - name: Remove Android asset aliases for original gzip copies
        run: |
          # Android strips the final ".gz" when merging assets, causing
          # Tidewrack raw+gzip to collide as one resource name. Retain the
          # prepared ORIGINAL raw ship and Hydra GLBs for Android playback.
          DIR=android/app/src/main/assets/public/proto3d/models-new
          test -s "$DIR/tidewrack_sailing_ship.glb"
          test -s "$DIR/hydra_restored_mobile.glb"
          rm -f "$DIR/tidewrack_sailing_ship.glb.gz" "$DIR/hydra_restored_mobile.glb.gz"
          echo "Android ship/Hydra assets: approved raw GLBs only"

      - name: Apply Varnethryl launcher icon and splash
        run: python3 tools/apply_android_icons.py
      - name: Configure stable signing and versionCode
        env:
          VARNETHRYL_KEYSTORE_B64: ${{ secrets.VARNETHRYL_KEYSTORE_B64 }}
          VARNETHRYL_KEYSTORE_PASSWORD: ${{ secrets.VARNETHRYL_KEYSTORE_PASSWORD }}
          VARNETHRYL_KEY_ALIAS: ${{ secrets.VARNETHRYL_KEY_ALIAS }}
          VARNETHRYL_KEY_PASSWORD: ${{ secrets.VARNETHRYL_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "$VARNETHRYL_KEYSTORE_B64" | base64 -d > android/app/varnethryl-release.jks
          VNAME=$(node -p "require('./package.json').version")
          VCODE=$((30200 + RUN_NUMBER))
          echo "versionName=$VNAME versionCode=$VCODE"
          python3 tools/configure_android_signing.py "$VNAME" "$VCODE"
      - name: Build signed APKs (debug and release)
        env:
          VARNETHRYL_KEYSTORE_PASSWORD: ${{ secrets.VARNETHRYL_KEYSTORE_PASSWORD }}
          VARNETHRYL_KEY_ALIAS: ${{ secrets.VARNETHRYL_KEY_ALIAS }}
          VARNETHRYL_KEY_PASSWORD: ${{ secrets.VARNETHRYL_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          # Maven Central sometimes returns transient 403/5xx responses on hosted
          # runners. Retry dependency resolution before treating it as a code error.
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android Gradle build failed after three attempts"
              exit 1
            fi
            echo "::warning::Gradle build attempt $attempt failed; retrying after 20 seconds"
            sleep 20
          done
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Varnethryl-RPG-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Varnethryl-RPG-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
