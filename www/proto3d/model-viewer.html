<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Varnethryl model viewer</title>
<style>html,body{margin:0;height:100%;background:#17151c;color:#e8dcc0;font:14px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ui{position:fixed;left:0;right:0;top:0;padding:8px;background:#000a;z-index:2;display:flex;flex-direction:column;gap:6px}
#sel{display:flex;gap:6px;flex-wrap:wrap}#ctl{display:flex;gap:6px;flex-wrap:wrap}
select,button{background:#2a2433;color:#e8dcc0;border:1px solid #6a5a3a;border-radius:8px;padding:10px 12px;font-size:15px;min-height:44px}
button.on{background:#6a5a3a;color:#fff}
#info{font-size:13px;opacity:.9}
#nav{display:flex;gap:6px}
#all{position:fixed;left:0;top:0;bottom:0;width:min(78vw,320px);background:#000d;z-index:5;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:none;padding:8px 6px}
#all div{padding:10px 10px;border-bottom:1px solid #fff2;font-size:15px;min-height:24px}#all div.on{background:#6a5a3a}#all div.hd{background:#241f2e;font-weight:700;position:sticky;top:0}
#all small{opacity:.7;margin-left:6px}.tagp{color:#ffb060}</style></head><body>
<canvas id="c"></canvas><div id="all"></div>
<div id="ui"><div id="sel"><select id="list"></select><div id="nav"><button id="prev">◀</button><button id="next">▶</button></div></div><div id="ctl"></div><button id="showall">☰ All models (<span id="cnt"></span>)</button><div id="info">loading…</div></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';
import { SpringBones } from './spring_bones.js';
const MAIN=['aldric','asha','brynn','cedric','darius','elira','finn','garruk','kael','mirelle','morwen','nyx','orin','rook','rowan','selene','seraphine','talia','thorne','vesper','wolf'];
const BETH=["briar", "cinder", "coral", "ember", "frosttroll", "hawk", "hearth", "hobgoblin", "hydrella", "kestrel", "lorian", "lunara", "marella", "mortimer", "mossgut", "neris", "pip", "snowy", "ssylthar", "stonetroll", "thrain", "vaelthryx", "valen", "wren", "wyvern", "zephyr"];
const NEW=[['darius','models/darius.glb'],['selene','models/selene.glb'],['mortimer_new','models-new/mortimer_cl_arms.glb'],['player_pikachu','models-new/player_pikachu_cl_arms.glb'],['lunara_new','models-new/lunara_cl_arms.glb'],['marella_new','models-new/marella_cl_arms.glb'],['vaelthryx_straight_rig'],['vaelthryx_new'],['ssylthar_new'],['ashentitan_new','models-new/ashentitan_cl_arms.glb'],['coral_new','models-new/coral_cl_arms.glb'],['cinder_new'],['snowy_new4','models-new/snowy_cl_arms.glb'],['zephyr_new2'],['garruk_new4'],['garruk_new5_arms'],['darius_new6_arms'],['pip_new2'],['owner','models-new/owner.glb'],['asha_new3','models-new/asha_cl_arms.glb'],['thrain_new4','models-new/thrain_cl_arms.glb'],['wren_new3','models-new/wren_cl_arms.glb'],['ember_new3']];
const PH=["aldric", "briar", "brynn", "cedric", "elira", "finn", "frosttroll", "hearth", "hobgoblin", "hydrella", "kael", "kestrel", "lorian", "lunara", "marella", "mirelle", "morwen", "mossgut", "neris", "nyx", "orin", "pip", "rook", "rowan", "seraphine", "stonetroll", "talia", "thorne", "valen", "vesper", "wyvern", "zephyr"];
const items=[...NEW.map(([n,u])=>({n,set:'NEW (Beth)',url:u||`models-new/${n}.glb`})),...PH.map(n=>({n:n+'_new',set:'PLACEHOLDER',url:`models-placeholder/${n}_new.glb`,ph:true})),...MAIN.map(n=>({n,set:'Old main',url:`models/${n}.glb`})),...BETH.map(n=>({n,set:'Old Beth',url:`models-beth/${n}.glb`}))];
const HEIGHT={stonetroll_new:3.0,frosttroll_new:3.0,thrain_new:1.35};   // humanoids are normalised to 1.9 m; trolls/dwarf scaled here, Snowy shown at native size with scale buttons
const NOTES={snowy_new4:'Snowy: walk 0.55 u/s, run 1.5 u/s.',zephyr_new2:'Zephyr: hind-foot sliding in walk is a known issue.',vaelthryx_straight_rig:'Straight rig: slither / coil / strike clips.',vaelthryx_new:'Coiled version.'};
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2b2838);scene.fog=new THREE.Fog(0x2b2838,12,40);
const cam=new THREE.PerspectiveCamera(45,1,0.05,100);
scene.add(new THREE.HemisphereLight(0xdfe8ff,0x4a4030,1.0));
const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.set(4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:25});scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(30,48),new THREE.MeshStandardMaterial({color:0x5b6b4a,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const grid=new THREE.GridHelper(20,20,0x889977,0x6f7e5e);grid.position.y=0.002;scene.add(grid);
// orbit
let az=0.6,el=0.25,dist=4,target=new THREE.Vector3(0,1,0),minD=0.5,maxD=20;
const ptrs=new Map();let pd=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size==2)pd=pinch();});
canvas.addEventListener('pointerup',e=>ptrs.delete(e.pointerId));canvas.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
function pinch(){const a=[...ptrs.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
 if(ptrs.size==1){az-=(e.clientX-p[0])*0.008;el=Math.max(-0.2,Math.min(1.45,el+(e.clientY-p[1])*0.008));p[0]=e.clientX;p[1]=e.clientY;}
 else{p[0]=e.clientX;p[1]=e.clientY;const d=pinch();if(pd)dist=Math.max(minD,Math.min(maxD,dist*pd/d));pd=d;}});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(minD,Math.min(maxD,dist*Math.exp(e.deltaY*0.001)));},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
// ui
const list=document.getElementById('list'),ctl=document.getElementById('ctl'),info=document.getElementById('info');
items.forEach((it,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(it.ph?'PLACEHOLDER: ':it.set+': ')+it.n;list.appendChild(o);});
let sb=null,scale=1,cur=null,mixer=null,actions={},active=null,idx=0,tris=0,loadId=0;
const loader=new GLTFLoader();
function setClip(name){if(!mixer)return;const a=actions[name];if(!a)return;if(active&&active!==a)active.fadeOut(0.2);a.reset().fadeIn(0.2).play();active=a;
 [...ctl.querySelectorAll('button[data-clip]')].forEach(b=>b.classList.toggle('on',b.dataset.clip===name));}
async function load(i){idx=i;list.value=i;const my=++loadId;const it=items[i];info.textContent='loading '+it.n+'…';
 window.__viewer.loaded=null;
 let kb=0;try{const r=await fetch(it.url);if(!r.ok)throw new Error('HTTP '+r.status);const buf=await r.arrayBuffer();kb=Math.round(buf.byteLength/1024);loader.parse(buf,'',onLoad,onErr);}catch(e){onErr(e);}
 function onErr(err){info.textContent='failed to load '+it.url+' : '+(err&&err.message||err);window.__viewer.loaded={name:it.n,error:String(err)};}
 function onLoad(g){if(my!==loadId)return;
  if(cur)scene.remove(cur);cur=g.scene;scene.add(cur);scale=HEIGHT[it.n]?0:1;sb=null;try{sb=new SpringBones(cur,{clips:g.animations})}catch(e){}
  tris=0;cur.traverse(o=>{if(o.isMesh){o.castShadow=true;const gm=o.geometry;tris+=(gm.index?gm.index.count:gm.attributes.position.count)/3;}});
  const box0=new THREE.Box3().setFromObject(cur);if(HEIGHT[it.n]){cur.scale.setScalar(HEIGHT[it.n]/Math.max(.01,box0.max.y-box0.min.y));cur.updateMatrixWorld(true)}const box=new THREE.Box3().setFromObject(cur);const size=box.getSize(new THREE.Vector3());const c=box.getCenter(new THREE.Vector3());
  cur.position.y-=box.min.y;target.set(0,size.y/2,0);dist=Math.max(size.y,size.x,size.z)*2.2;minD=dist*0.15;maxD=dist*5;
  mixer=new THREE.AnimationMixer(cur);actions={};ctl.innerHTML='';active=null;
  const clips=g.animations;
  clips.forEach(cl=>{actions[cl.name]=mixer.clipAction(cl);const b=document.createElement('button');b.textContent=cl.name;b.dataset.clip=cl.name;b.onclick=()=>setClip(cl.name);ctl.appendChild(b);});
  const rb=document.createElement('button');rb.textContent='⏸';rb.onclick=()=>{mixer.timeScale=mixer.timeScale?0:1;rb.classList.toggle('on',!mixer.timeScale)};ctl.appendChild(rb);
  const names=clips.map(c=>c.name);
  const pick=names.find(n=>/idle/i.test(n))||names[0];if(pick)setClip(pick);
  info.textContent=`${it.ph?'PLACEHOLDER (old generated model)':it.set}: ${it.n} · ${kb} KB · ${(box.max.y-box.min.y).toFixed(2)} m · ${Math.round(tris).toLocaleString()} tris · `+(names.length?`clips: ${names.join(', ')}`:'no animation clips in this model (static pose)');
  if(NOTES[it.n])info.textContent+=' · '+NOTES[it.n];window.__viewer.loaded={name:it.n,set:it.set,kb,dim:[size.x,size.y,size.z].map(v=>+v.toFixed(2)),tris:Math.round(tris),clips:names};
 }}
const allEl=document.getElementById('all');document.getElementById('cnt').textContent=items.length;
{let last='';items.forEach((it,i)=>{if(it.set!==last){last=it.set;const h=document.createElement('div');h.className='hd';h.textContent=(it.ph?'PLACEHOLDER (old generated, to be replaced)':it.set==='NEW (Beth)'?'NEW (Beth) - real models':it.set==='Old main'?'Old main set (playable + wolf)':'Old Beth set (NPCs/monsters/bosses)');allEl.appendChild(h);}
 const d=document.createElement('div');d.dataset.i=i;d.innerHTML=it.n+(it.ph?'<small class="tagp">PLACEHOLDER</small>':'');d.addEventListener('click',()=>{allEl.style.display='none';load(i);});allEl.appendChild(d);});}
document.getElementById('showall').onclick=()=>{allEl.style.display=allEl.style.display==='block'?'none':'block';[...allEl.querySelectorAll('div[data-i]')].forEach(d=>d.classList.toggle('on',+d.dataset.i===idx));const o=allEl.querySelector('.on');if(o)o.scrollIntoView({block:'center'});};
list.onchange=()=>load(+list.value);
document.getElementById('prev').onclick=()=>load((idx+items.length-1)%items.length);
document.getElementById('next').onclick=()=>load((idx+1)%items.length);
const clock=new THREE.Clock();
window.__viewer={items,load,setClip,get time(){return active?active.time:null},sample(){if(!cur)return null;let s=0;cur.traverse(o=>{if(o.isMesh||o.isObject3D){s+=o.position.x*3+o.position.y*5+o.position.z*7+o.rotation.x*11+o.rotation.y*13+o.rotation.z*17+o.quaternion.x+o.quaternion.y*2+o.quaternion.z*3;}});return s;},loaded:null};
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),0.1);if(mixer)mixer.update(dt);if(sb)sb.update(dt);
 cam.position.set(target.x+dist*Math.cos(el)*Math.sin(az),target.y+dist*Math.sin(el),target.z+dist*Math.cos(el)*Math.cos(az));cam.lookAt(target);renderer.render(scene,cam);});
load(0);
</script></body></html>
