name: Test Marine Maps and Hydra Gameplay
on:
  push:
    branches: [main]
    paths:
      - 'www/proto3d/water-realms.js'
      - 'www/proto3d/main.js'
      - 'www/proto3d/fight.js'
      - 'www/proto3d/combat/**'
      - 'www/proto3d/cheatpanel.js'
      - 'www/proto3d/cheats.js'
      - 'www/proto3d/models-new/hydra_restored_mobile.glb.gz'
      - 'www/proto3d/models-new/tidewrack_sailing_ship.glb.gz'
      - 'tools/marine_browser_test.py'
      - '.github/workflows/test-marine-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Hydra boss patterns, sailing modules and owner teleports
        run: |
          node tools/check_boss_regions.mjs
          node tools/boss_patterns_test.mjs
          node tools/owner_cheats_test.mjs
      - name: Install headless mobile and desktop Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Play Hydra Mire, sail across ocean and return to town
        run: python tools/marine_browser_test.py
      - name: Save marine gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Varnethryl-Hydra-Sailing-Mobile-Desktop-Smoke
          path: /tmp/marine-*.png
          if-no-files-found: ignore
