<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b2c"><title>Varnethryl 3D</title><style>html,body{margin:0;min-height:100%;background:#101c2d;color:#f2d6a1;font:16px Georgia,serif;display:grid;place-items:center;text-align:center}a{color:#e8c47f}</style></head><body><main><h1>VARNETHRYL</h1><p id="m">Entering the 3D kingdom…</p><a href="proto3d.html">Launch 3D game</a> · <small><a href="index2d.html">Classic 2D mode</a></small></main>
<script>
/* Always 3D by default (v1.5.33: a stale saved 2D choice is cleared). Falls back to the classic 2D game only when asked (?mode=2d)
   or when this device cannot run the 3D engine: no WebGL, no import maps, or the engine module fails to load. */
(function(){
  var q=new URLSearchParams(location.search), tail=(location.search||'')+(location.hash||'');
  try{localStorage.removeItem('vn_mode')}catch(e){}
  function go2d(why){try{sessionStorage.setItem('vn_fallback',why)}catch(e){}location.replace('index2d.html'+(location.hash||''))}
  if(q.get('mode')==='2d')return go2d('requested');
  try{var c=document.createElement('canvas');if(!(c.getContext('webgl2')||c.getContext('webgl')))return go2d('no-webgl')}catch(e){return go2d('no-webgl')}
  if(!(window.HTMLScriptElement&&HTMLScriptElement.supports&&HTMLScriptElement.supports('importmap')))return go2d('no-importmap');
  import('./proto3d/vendor/three.module.js').then(function(){location.replace('proto3d.html'+tail)},function(){go2d('import-failed')});
})();
</script><noscript><meta http-equiv="refresh" content="0;url=index2d.html"></noscript></body></html>
