name: Publish Varnethryl Web App
on:
  push:
    branches: [main, master]
    paths:
      - 'www/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game assets
        run: |
          python3 tools/check_assets.py
          python3 tools/verify_frost_troll_b.py
      - name: Check multiplayer, ocean and Coliseum regressions
        run: |
          node tools/check_multiplayer_ocean_arena.mjs
          node tools/check_ladders_jump.mjs
          node tools/check_multitouch_controls.mjs
          node tools/check_owner_map_routes.mjs
      - name: Check JavaScript syntax
        run: |
          find www -type f -name "*.js" -not -path "*/vendor/*" -print0 | xargs -0 -n1 node --check
      - name: Include raw marine GLBs for Android/WebView compatibility
        run: python3 tools/prepare_marine_assets.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web app
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
