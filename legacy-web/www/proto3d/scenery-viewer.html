<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VARNETHRYL 3D scenery viewer</title>
<style>html,body{margin:0;height:100%;background:#1a1d24;color:#e8dcc0;font:13px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}
#ui{position:fixed;left:0;right:0;top:0;padding:6px;background:#000a;display:flex;flex-direction:column;gap:5px;z-index:2;max-height:44vh;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:5px;align-items:center}button{background:#2a2433;color:#e8dcc0;border:1px solid #6a5a3a;border-radius:6px;padding:5px 9px;cursor:pointer;font-size:12px}button.on{background:#c9a24a;color:#1b2433;font-weight:700}
#info{position:fixed;left:8px;bottom:6px;opacity:.8;font-size:12px;text-shadow:0 1px 2px #000}</style></head><body>
<canvas id="c"></canvas><div id="ui"></div><div id="info"></div>
<script type="module" src="scenery-viewer.js"></script></body></html>
