name: Smoke test expanded town in browser
on:
  pull_request:
    branches: [main]
    paths:
      - 'www/proto3d/buildings.js'
      - 'www/proto3d/main.js'
      - 'www/proto3d/townlands.js'
      - 'tools/town_expansion_browser_test.py'
      - '.github/workflows/test-town-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test larger town and Wilds travel
        run: python tools/town_expansion_browser_test.py
