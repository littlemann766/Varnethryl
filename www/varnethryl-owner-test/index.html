<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Varnethryl — Owner Lightsaber Test</title><style>body{margin:0;background:#10101b;color:#e8d6a0;font-family:Georgia,serif}canvas{display:block}#ui{position:fixed;top:12px;left:12px;background:#161421df;border:1px solid #a98c50;padding:14px;border-radius:8px;max-width:290px}button{background:#292138;color:#e8d6a0;border:1px solid #b49b60;padding:9px;margin:3px;cursor:pointer}#status{font-size:13px;margin-top:9px}small{color:#b7b1ad}</style></head><body><div id="ui"><b>VARNETHRYL · OWNER TEST</b><p><small>Animated Golden Cloaked Hero + hand-attached lightsaber</small></p><button id="idle">Idle</button><button id="walk">Walk</button><button id="run">Run</button><button id="saber">Toggle Saber</button><div id="status">Loading model…</div><small>Drag to orbit · scroll to zoom. Requires an internet connection for the Three.js renderer.</small></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x10101b);scene.fog=new THREE.Fog(0x10101b,14,32);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(3,2.5,6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.2,0);orbit.update();scene.add(new THREE.HemisphereLight(0xc3d5ff,0x4a2c1e,2));const sun=new THREE.DirectionalLight(0xffe2ae,3);sun.position.set(4,9,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const floor=new THREE.Mesh(new THREE.CircleGeometry(9,80),new THREE.MeshStandardMaterial({color:0x29252b,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(14,14,0x55412e,0x302c33);grid.position.y=.005;scene.add(grid);
let mixer,actions={},current,saber;new GLTFLoader().load('./owner-animated.glb',g=>{const model=g.scene;scene.add(model);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});const box=new THREE.Box3().setFromObject(model),sz=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());model.position.set(-center.x,-box.min.y,-center.z);const scale=2.1/Math.max(sz.y,.01);model.scale.setScalar(scale);mixer=new THREE.AnimationMixer(model);for(const clip of g.animations){actions[clip.name.toLowerCase()]=mixer.clipAction(clip)}const hand=model.getObjectByName('mixamorig:RightHand');if(hand){saber=new THREE.Group();hand.add(saber);const grip=new THREE.Mesh(new THREE.CylinderGeometry(.028,.035,.24,12),new THREE.MeshStandardMaterial({color:0x999ba5,metalness:.85,roughness:.2}));grip.position.y=.12;saber.add(grip);const blade=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.95,12),new THREE.MeshBasicMaterial({color:0x9c7bff}));blade.position.y=.71;saber.add(blade);const glow=new THREE.PointLight(0x8b5cff,2,2);glow.position.y=.6;saber.add(glow);saber.rotation.set(Math.PI/2,0,0);saber.position.set(0,.03,0)}else status.textContent='Model loaded; right-hand bone not found.';status.textContent=`Loaded ${g.animations.map(a=>a.name).join(', ')} · ${hand?'lightsaber attached':'no right hand found'}`;play('walking');},undefined,e=>status.textContent='Load failed: '+e.message);function play(name){if(current)current.fadeOut(.2);current=actions[name];if(current){current.reset().fadeIn(.2).play();status.textContent='Playing '+name}else if(name!=='idle')status.textContent='Animation unavailable: '+name}document.getElementById('idle').onclick=()=>{if(current){current.fadeOut(.2);current=null}status.textContent='Idle pose (no idle clip included)'};document.getElementById('walk').onclick=()=>play('walking');document.getElementById('run').onclick=()=>play('running');document.getElementById('saber').onclick=()=>{if(saber)saber.visible=!saber.visible};const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=clock.getDelta();if(mixer)mixer.update(dt);orbit.update();renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
