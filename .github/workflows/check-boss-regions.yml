name: Validate Varnethryl boss regions
on:
  pull_request:
    branches: [main]
    paths:
      - 'www/proto3d/**'
      - 'tools/check_boss_regions.mjs'
      - '.github/workflows/check-boss-regions.yml'
permissions:
  contents: read
jobs:
  boss-regions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/check_boss_regions.mjs
