name: Verify expanded town map
on:
  pull_request:
    branches: [main]
    paths:
      - 'www/proto3d/buildings.js'
      - 'www/proto3d/main.js'
      - 'www/proto3d/townlands.js'
      - 'tools/check_town_expansion.mjs'
      - '.github/workflows/verify-town-expansion.yml'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Town boundary, layout, collision and syntax checks
        run: node tools/check_town_expansion.mjs
      - name: Validate all game assets
        run: python3 tools/check_assets.py
