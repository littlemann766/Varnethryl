<!doctype html><html><head><meta charset="utf-8"><title>Beth world kit</title>
<style>body{margin:0;background:#1d2230;font:12px sans-serif;color:#eee}#g{display:grid;grid-template-columns:repeat(var(--c,8),1fr);gap:2px}
.c{position:relative;background:#8fb0c8}.c canvas{display:block;width:100%}.c span{position:absolute;left:3px;bottom:2px;text-shadow:0 0 3px #000}</style></head>
<script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script><body><div id="g"></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from '../../vendor/jsm/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search),cat=q.get('cat'),S=+(q.get('s')||220);
const idx=(await (await fetch('kit_index.json')).json()).filter(e=>!cat||cat.split(',').includes(e.cat)).filter(e=>q.get('lod')||!/_lod1|_bb/.test(e.file));
document.body.style.setProperty('--c',q.get('cols')||8);
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(S,S);R.outputColorSpace=THREE.SRGBColorSpace;
const L=new GLTFLoader();
for(const e of idx){const g=await L.loadAsync(e.file);const sc=new THREE.Scene();sc.background=new THREE.Color(0x9cc0da);
sc.add(new THREE.HemisphereLight(0xdfefff,0x5a6040,1.6));const d=new THREE.DirectionalLight(0xfff4e0,2.2);d.position.set(4,8,5);sc.add(d);
const gr=new THREE.Mesh(new THREE.CircleGeometry(60,24),new THREE.MeshLambertMaterial({color:0x6f9a50}));gr.rotation.x=-Math.PI/2;sc.add(gr);sc.add(g.scene);
const b=new THREE.Box3().setFromObject(g.scene),sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),r=Math.max(sz.x,sz.y,sz.z)*.75+.3;
const cam=new THREE.PerspectiveCamera(35,1,.05,500);cam.position.set(c.x+r*1.6,c.y+r*1.0,c.z+r*2.0);cam.lookAt(c);R.render(sc,cam);
const cv=document.createElement('canvas');cv.width=cv.height=S;cv.getContext('2d').drawImage(R.domElement,0,0);
const div=document.createElement('div');div.className='c';div.append(cv);const sp=document.createElement('span');sp.textContent=e.file.split('/')[1].replace('.glb','')+' · '+e.tris+'t';div.append(sp);document.getElementById('g').append(div);}
window.__done=true;</script></body></html>
