name: Build isolated Varnethryl overhaul test APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'www/**'
      - 'tools/**'
      - 'package.json'
      - '.github/workflows/build-overhaul-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate changed systems
        run: |
          node tools/check_overhaul.mjs
          node tools/check_serpent_locomotion.mjs
          node tools/check_boss_ai.mjs
          node tools/check_exp_ui.mjs
          node tools/check_boss_regions.mjs
          node tools/check_release_cache.mjs
          python3 tools/check_assets.py
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: npx cap add android
      - name: Synchronize game assets
        run: npx cap sync android
      - name: Isolate test application from installed Varnethryl
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          needle = 'defaultConfig {'
          assert needle in text, 'Capacitor Android defaultConfig not found'
          text = text.replace(needle, needle + '\n        applicationIdSuffix ".overhaul"', 1)
          path.write_text(text)
          # Distinct displayed launcher name to avoid confusing debug with live.
          label = Path('android/app/src/main/res/values/strings.xml')
          if label.exists():
              text = label.read_text()
              text = text.replace('<string name="app_name">Varnethryl</string>', '<string name="app_name">Varnethryl Overhaul Test</string>')
              label.write_text(text)
          PY
      - name: Assemble test-only debug APK without production signing secrets
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload side-by-side test APK
        uses: actions/upload-artifact@v4
        with:
          name: Varnethryl-Overhaul-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
