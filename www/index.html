<b>VARNETHRYL</b><small id="m">Loading 3D world&hellip;</small><small><a href="index2d.html">Classic 2D mode</a></small>
<script>
/* Default entry: 3D. Falls back to the classic 2D game (index2d.html) if ?mode=2d, WebGL is unavailable, or the 3D engine cannot be imported. */
(function(){
  var q=new URLSearchParams(location.search);
  function go2d(why){try{sessionStorage.setItem('vn_fallback',why)}catch(e){}location.replace('index2d.html'+location.hash)}
  if(q.get('mode')==='3d'){try{localStorage.removeItem('vn_mode')}catch(e){}}
  else if(q.get('mode')==='2d'||(function(){try{return localStorage.getItem('vn_mode')==='2d'}catch(e){return false}})())return go2d('requested');
  try{var c=document.createElement('canvas');if(!(c.getContext('webgl2')||c.getContext('webgl')))return go2d('no-webgl')}catch(e){return go2d('no-webgl')}
  if(!(window.HTMLScriptElement&&HTMLScriptElement.supports&&HTMLScriptElement.supports('importmap')))return go2d('no-importmap');
  import('./proto3d/vendor/three.module.js').then(function(){
    try{sessionStorage.setItem('vn_default3d','1')}catch(e){}
    location.replace('proto3d.html'+location.search+location.hash);
  },function(){go2d('import-failed')});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(function(){});
})();
</script><noscript><meta http-equiv="refresh" content="0;url=index2d.html"/></noscript></body></html>
