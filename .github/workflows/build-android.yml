name: Build Varnethryl Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
concurrency:
  group: varnethryl-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check game assets
        run: python3 tools/check_assets.py
      - name: Check JavaScript syntax
        run: |
          find www -type f -name "*.js" -not -path "*/vendor/*" -print0 | xargs -0 -n1 node --check
      - name: Add Android project
        run: npx cap add android
      - name: Copy web assets
        run: npx cap sync android
      - name: Apply Varnethryl launcher icon and splash
        run: python3 tools/apply_android_icons.py
      - name: Configure stable signing and versionCode
        env:
          VARNETHRYL_KEYSTORE_B64: ${{ secrets.VARNETHRYL_KEYSTORE_B64 }}
          VARNETHRYL_KEYSTORE_PASSWORD: ${{ secrets.VARNETHRYL_KEYSTORE_PASSWORD }}
          VARNETHRYL_KEY_ALIAS: ${{ secrets.VARNETHRYL_KEY_ALIAS }}
          VARNETHRYL_KEY_PASSWORD: ${{ secrets.VARNETHRYL_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "$VARNETHRYL_KEYSTORE_B64" | base64 -d > android/app/varnethryl-release.jks
          VNAME=$(node -p "require('./package.json').version")
          VCODE=$((30200 + RUN_NUMBER))
          echo "versionName=$VNAME versionCode=$VCODE"
          python3 tools/configure_android_signing.py "$VNAME" "$VCODE"
      - name: Build signed APKs (debug and release)
        env:
          VARNETHRYL_KEYSTORE_PASSWORD: ${{ secrets.VARNETHRYL_KEYSTORE_PASSWORD }}
          VARNETHRYL_KEY_ALIAS: ${{ secrets.VARNETHRYL_KEY_ALIAS }}
          VARNETHRYL_KEY_PASSWORD: ${{ secrets.VARNETHRYL_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          # Maven Central sometimes returns transient 403/5xx responses on hosted
          # runners. Retry dependency resolution before treating it as a code error.
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android Gradle build failed after three attempts"
              exit 1
            fi
            echo "::warning::Gradle build attempt $attempt failed; retrying after 20 seconds"
            sleep 20
          done
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Varnethryl-RPG-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Varnethryl-RPG-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
